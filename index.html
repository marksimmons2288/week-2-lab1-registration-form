<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!--Styles-->
    <link rel="stylesheet" href="./styles.css">
    
</head>
<body>
    <header class="header">
        <h1>Welcome to my Registration Form</h1>
    </header>
   
    <main>
        <h2>Contact me form</h2>

        <form action="" class="main_form" id="main-form">
        <!-- First Name -->
        <div class="main_form_field">
            <label for="firstName"
            class="main_form_field_label">First name:</label>
            <input type="text" id="firstName"
            class="main_form_field_input" required>
        </div>
       
        <!-- Last Name -->
         <div class="main_form_field">
            <label for="lastName" class="main_form_field_label">Last name:</label>
            <input type="text" id="lastName"
            class="main_form_field_input" required>
         </div>

         <!-- E-mail Input -->
          <div class="main_form_field">
           <label for="email"
            class="main_form_field_label">E-mail:</label>
            <input type="email" id="email"
            class="main_form_field_input" required>  

            <!-- Date of Birth -->
          <div class="main_form_field">
           <label for="birthday"
            class="main_form_field_label">Date of Birth:</label>
            <input type="date" id="date"
            class="main_form_field_input" required>

            <!-- Password -->
          </div class="main_form_field">
           <label for="password"
            class="main_form_field_label">Password:</label>
            <input type="password" id="password" minlength="6"
            class="main_form_field_input" required>

            <!-- Checkbox -->
          <div class="main_form_field">
           <label for="checkbox"
            class="main_form_field_label">Check this box after all fields have been filled:</label>
            <input type="checkbox" id="checkbox"
            class="main_form_field_input" required>    

            



         <button class="main_form_submit" type="submit">Send</button>
         
         <div id="output"></div>

        
    </form>
    </main>

    <!-- Javascript -->
     <script src="./main.js"></script>
    
    
    
</body>
</html>
